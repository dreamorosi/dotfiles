# Managed by dotfiles (dreamorosi/dotfiles). Do not add machine-specific
# or corporate hosts here -- put those in ~/.ssh/config.d/99-local.conf
# (which is not tracked) or directly in ~/.ssh/config.

# UseKeychain is an Apple-only option; OpenSSH on Linux rejects the whole
# file over it. IgnoreUnknown only covers options parsed *after* it, because
# ssh reads this file top to bottom, so it has to be declared here rather
# than inside the Host block that uses it.
IgnoreUnknown UseKeychain

Host github.com
  AddKeysToAgent yes
  IdentityFile ~/.ssh/github

Host OCIDev
  HostName 130.61.210.77
  User ubuntu
  IdentityFile ~/.ssh/ocidev.key
  ForwardAgent yes
  UseKeychain yes
  AddKeysToAgent yes
