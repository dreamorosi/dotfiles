# Managed by dotfiles (dreamorosi/dotfiles). macOS-only hosts.
# bootstrap.sh only symlinks *.macos.conf on macOS, so these hosts are not
# present on Linux machines.

# rpi-pw.local: local service on the home network (macOS machines only)
Host rpi-pw.local
  HostName rpi-pw.local
  User andre
  IdentityFile ~/.ssh/vscode
  ForwardAgent yes
